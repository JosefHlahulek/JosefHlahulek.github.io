<style>
  body { padding-bottom: 140px; }
  .top { display: flex; justify-content: space-between; align-items: center; height: 76px; font-size: 14px; color: var(--muted); }
  .top a:hover { color: var(--ink); }
  .tools { display: flex; gap: 8px 24px; flex-wrap: wrap; align-items: baseline; font-size: 14px; color: var(--muted); margin: 0 0 40px; }
  .link { background: none; border: 0; border-bottom: 1px solid var(--ink); padding: 0 0 1px; font: inherit; font-size: 14px; font-weight: 500;
          cursor: pointer; color: var(--ink); transition: color .2s, border-color .2s; }
  .link:hover { color: var(--accent); border-color: var(--accent); }
  .link[disabled] { opacity: .35; cursor: default; border-color: var(--line); color: var(--muted); }

  .line { overflow-x: auto; overflow-y: hidden; padding: 10px 0 12px 1.6em; }
  .reveal { display: inline-block; clip-path: inset(-10% 100% -10% 0); transition: clip-path var(--dur, 2s) linear; }
  .in > .reveal { clip-path: inset(-10% -2% -10% 0); }
  .line.inside { color: var(--muted); }

  /* thought-process comments: appear, stay a while, then fade and collapse */
  .th { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .8s ease, opacity .8s ease; margin-left: 1.6em; }
  .th > div { overflow: hidden; }
  .th.in { grid-template-rows: 1fr; opacity: 1; }
  .th p { margin: 4px 0 10px; padding-left: 16px; border-left: 2px solid var(--accent); color: var(--muted); font-family: var(--serif);
          font-style: italic; font-size: clamp(17px, 2.2vw, 20px); line-height: 1.5; max-width: 62ch; }
  .th.dim p { border-left-color: var(--line); }
  .th .katex { font-size: 1.04em; }
  .term { background: none; border: 0; border-bottom: 1.5px dotted var(--accent); padding: 0; font: inherit; font-style: italic; color: var(--ink);
          cursor: pointer; transition: color .2s; }
  .term:hover { color: var(--accent); }

  /* side calculation: comment on the left, intermediate result for A_n and B_n on the right */
  .mid > div { display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.35fr); gap: 8px 36px; align-items: start; }
  .midr { border-left: 1px solid var(--line); padding: 4px 0 4px 24px; }
  .midr .blk + .blk { border-top: 1px dashed var(--line); margin-top: 8px; padding-top: 10px; }
  .midr .ml { overflow-x: auto; overflow-y: hidden; padding: 2px 0 4px; font-size: .94em; }
  .midr .katex { font-size: 1.02em; }
  .inside-note p { margin: 18px 0 4px; padding-left: 16px; border-left: 2px solid var(--line); color: var(--muted); font-family: var(--serif); font-style: italic; font-size: 18px; max-width: 62ch; }
  .lineterm { opacity: 0; margin-left: 16px; font-size: 15px; font-family: var(--serif); transition: opacity .9s ease; vertical-align: middle; }
  .line.done .lineterm { opacity: 1; }
  .hint { color: var(--muted); font-size: 14px; margin-top: 34px; }

  #pop { position: absolute; z-index: 30; max-width: min(480px, calc(100vw - 32px)); background: var(--bg); border: 1px solid var(--accent);
         border-radius: 10px; padding: 18px 22px 16px; box-shadow: 0 24px 50px -24px rgba(13,27,42,.45); }
  #pop p { margin: 0 0 10px; font-family: var(--serif); font-size: 18px; line-height: 1.5; }
  #pop .pt { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-family: var(--sans); font-weight: 500; margin-bottom: 8px; }
  #pop .acts { display: flex; gap: 22px; align-items: baseline; margin-top: 6px; }
  #pop .x { font-size: 13px; color: var(--muted); cursor: pointer; background: none; border: 0; padding: 0; font-family: var(--sans); }
  #pop .x:hover { color: var(--ink); }
  #pop .do { font-size: 14px; font-weight: 500; color: var(--ink); cursor: pointer; background: none; border: 0; border-bottom: 1px solid var(--ink); padding: 0 0 1px; font-family: var(--sans); }
  #pop .do:hover { color: var(--accent); border-color: var(--accent); }
  .badge { position: fixed; left: 0; right: 0; bottom: 0; text-align: center; padding: 10px 16px; font-size: 13px; color: var(--muted);
           background: rgba(246,245,241,.9); border-top: 1px solid var(--line); display: none; }
  .badge.on { display: block; }
  @media (max-width: 860px) {
    .mid > div { grid-template-columns: 1fr; }
    .midr { border-left: 0; padding-left: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { .reveal { transition-duration: 0s !important; } .th, .assign { transition: none; } }

<body>
<div class="wrap">
  <div class="top">
    <a href="../cviceni.html">← Cvičení z analýzy</a>

  </div>

  <div class="tools">
    <button class="link" id="prev" type="button">← Zpět</button>

  </div>

  <div class="assign" id="assign">
    <div class="lbl">Příklad 26</div>
    <div class="ex" id="ex"></div>
  </div>

  <div id="lines"></div>

  <p class="hint">Klikni na podtržená slova, vyskočí upřesnění. Dál a zpět se pohybuješ tlačítky nebo šipkami na klávesnici.</p>
</div>

<div id="pop" hidden role="dialog" aria-label="Upřesnění pojmu"></div>

<script src="../assets/katex/katex.min.js"></script>
<script>
(function () {
  if (!window.katex) { document.getElementById('ex').textContent = 'Vzorce se nepodařilo načíst. Zkus stránku obnovit.'; return; }

  var T = String.raw;   // TeX is written without doubling the backslashes

  /* ---------- content ---------- */
  var ASSIGN = T`\displaystyle\lim_{n\to\infty}\left(\sqrt[3]{\sqrt{n^{7}}+\sqrt[3]{n^{7}}}-\sqrt[3]{\sqrt{n^{7}}-\sqrt[3]{n^{7}}}\right)`;

  // main calculation. The cube roots cancel against the cubes, so the numerator has no roots; the denominator keeps A_n, B_n.
  var L1 = T`=\lim_{n\to\infty}\dfrac{\bigl(n^{7/2}+n^{7/3}\bigr)-\bigl(n^{7/2}-n^{7/3}\bigr)}{A_n^{2}+A_nB_n+B_n^{2}}`;
  // numerator computed (top), n^{7/3} factored out of the denominator (bottom)
  var L2 = T`=\lim_{n\to\infty}\dfrac{2n^{7/3}}{n^{7/3}\Bigl[\Bigl(\dfrac{A_n}{n^{7/6}}\Bigr)^{2}+\dfrac{A_n}{n^{7/6}}\cdot\dfrac{B_n}{n^{7/6}}+\Bigl(\dfrac{B_n}{n^{7/6}}\Bigr)^{2}\Bigr]}`;

  // side calculation on the right: how A_n and B_n behave compared with n^{7/6} (identical for both)
  var tex_a1 = T`\lim_{n\to\infty}\dfrac{A_n}{n^{7/6}}=\lim_{n\to\infty}\sqrt[3]{\dfrac{n^{7/2}+n^{7/3}}{n^{7/2}}}`;
  var tex_a2 = T`\overset{\text{ZOAL}}{=}\sqrt[3]{\lim_{n\to\infty}\dfrac{n^{7/2}+n^{7/3}}{n^{7/2}}}`;
  var tex_a3 = T`=\sqrt[3]{\lim_{n\to\infty}\dfrac{n^{7/2}\bigl(1+n^{7/3-7/2}\bigr)}{n^{7/2}}}`;
  var tex_a4 = T`=\sqrt[3]{\lim_{n\to\infty}\bigl(1+n^{-7/6}\bigr)}`;
  var tex_a5 = T`\overset{\text{AL}}{=}\sqrt[3]{1+0}=1`;
  var tex_b1 = T`\lim_{n\to\infty}\dfrac{B_n}{n^{7/6}}=\lim_{n\to\infty}\sqrt[3]{\dfrac{n^{7/2}-n^{7/3}}{n^{7/2}}}`;
  var tex_b2 = T`\overset{\text{ZOAL}}{=}\sqrt[3]{\lim_{n\to\infty}\dfrac{n^{7/2}-n^{7/3}}{n^{7/2}}}`;
  var tex_b3 = T`=\sqrt[3]{\lim_{n\to\infty}\dfrac{n^{7/2}\bigl(1-n^{7/3-7/2}\bigr)}{n^{7/2}}}`;
  var tex_b4 = T`=\sqrt[3]{\lim_{n\to\infty}\bigl(1-n^{-7/6}\bigr)}`;
  var tex_b5 = T`\overset{\text{AL}}{=}\sqrt[3]{1-0}=1`;
  var L3 = T`=\lim_{n\to\infty}\dfrac{2}{\Bigl(\dfrac{A_n}{n^{7/6}}\Bigr)^{2}+\dfrac{A_n}{n^{7/6}}\cdot\dfrac{B_n}{n^{7/6}}+\Bigl(\dfrac{B_n}{n^{7/6}}\Bigr)^{2}}`;
  var L4 = T`\overset{\text{AL}}{=}\dfrac{2}{1^{2}+1\cdot1+1^{2}}=\dfrac{2}{3}`;
  var MID = { a: [tex_a1, tex_a2, tex_a3, tex_a4, tex_a5], b: [tex_b1, tex_b2, tex_b3, tex_b4, tex_b5] };

  // "without A_n, B_n": only shown on request, to see what happens inside
  var tex_p0 = T`\lim_{n\to\infty}\Bigl(\sqrt[3]{n^{7/2}+n^{7/3}}-\sqrt[3]{n^{7/2}-n^{7/3}}\Bigr)`;
  var tex_p1 = T`=\lim_{n\to\infty}\dfrac{\bigl(n^{7/2}+n^{7/3}\bigr)-\bigl(n^{7/2}-n^{7/3}\bigr)}{\sqrt[3]{\bigl(n^{7/2}+n^{7/3}\bigr)^{2}}+\sqrt[3]{\bigl(n^{7/2}+n^{7/3}\bigr)\bigl(n^{7/2}-n^{7/3}\bigr)}+\sqrt[3]{\bigl(n^{7/2}-n^{7/3}\bigr)^{2}}}`;
  var tex_p2 = T`=\lim_{n\to\infty}\dfrac{2n^{7/3}}{n^{7/3}\Bigl[\sqrt[3]{\bigl(1+n^{-7/6}\bigr)^{2}}+\sqrt[3]{1-n^{-7/3}}+\sqrt[3]{\bigl(1-n^{-7/6}\bigr)^{2}}\Bigr]}`;
  var tex_p3 = T`=\lim_{n\to\infty}\dfrac{2}{\sqrt[3]{\bigl(1+n^{-7/6}\bigr)^{2}}+\sqrt[3]{1-n^{-7/3}}+\sqrt[3]{\bigl(1-n^{-7/6}\bigr)^{2}}}`;
  var tex_p4 = T`\overset{\text{ZOAL}}{=}\dfrac{2}{\sqrt[3]{\lim\bigl(1+n^{-7/6}\bigr)^{2}}+\sqrt[3]{\lim\bigl(1-n^{-7/3}\bigr)}+\sqrt[3]{\lim\bigl(1-n^{-7/6}\bigr)^{2}}}`;
  var tex_p5 = T`\overset{\text{AL}}{=}\dfrac{2}{\sqrt[3]{1}+\sqrt[3]{1}+\sqrt[3]{1}}=\dfrac{2}{3}`;
  var INSIDE = [tex_p0, tex_p1, tex_p2, tex_p3, tex_p4, tex_p5];

  // thought text: $...$ is math, {{term}} and {{alt}} are the clickable phrases
  var TH = {
    q:    T`Chovají se ty odmocniny {{term}}?`,
    mark: T`Označím $A_n=\sqrt[3]{\sqrt{n^7}+\sqrt[3]{n^7}}$ a $B_n=\sqrt[3]{\sqrt{n^7}-\sqrt[3]{n^7}}$.`,
    dom:  T`Pod třetí odmocninou dominuje, tedy nejrychleji roste, člen $\sqrt{n^7}=n^{7/2}$, protože $\tfrac72>\tfrac73$.`,
    asym: T`Proto $A_n,\,B_n\sim\sqrt[3]{n^{7/2}}=n^{7/6}$.`,
    midq: T`Jak se $A_n$ chová vzhledem k $n^{7/6}$? Podíl napíšu pod jednu odmocninu, protože $n^{7/6}=\sqrt[3]{n^{7/2}}$. Limitu vložím dovnitř, protože odmocnina je spojitá na svém $D_f$ (ZOAL), a pak vytknu. Pro $B_n$ je to úplně stejné.`,
    chk:  T`Obě limity jsou rovny 1, takže $\dfrac{A_n}{B_n}\to1$, tedy nenulová konstanta.`,
    yes:  T`Ano, chovají se {{term}}: obě jdou k $\infty$ stejně rychle, takže rozdíl je typu $\infty-\infty$.`,
    no:   T`Kdyby ne: vytknu nejrychleji rostoucí člen, použiju AL a dostanu definovaný výraz. Tady to nepomůže.`,
    form: T`Použiju tedy vzorec $a^3-b^3=(a-b)(a^2+ab+b^2)$, tj. $a-b=\dfrac{a^3-b^3}{a^2+ab+b^2}$.`,
    sub:  T`Za $a$ dosazuju první člen $A_n$, za $b$ druhý člen $B_n$.`,
    num:  T`Nahoře: $\bigl(n^{7/2}+n^{7/3}\bigr)-\bigl(n^{7/2}-n^{7/3}\bigr)=2n^{7/3}$.`,
    den:  T`Dole: protože $A_n,\,B_n\sim n^{7/6}$, chovají se $A_n^2$, $A_nB_n$ i $B_n^2$ jako $n^{7/3}$. Proto z celého jmenovatele vytknu $n^{7/3}$.`,
    cut:  T`Krátím $n^{7/3}$ v čitateli i ve jmenovateli.`,
    ref:  T`Podle mezivýpočtu výše je $\lim\dfrac{A_n}{n^{7/6}}=1$ a $\lim\dfrac{B_n}{n^{7/6}}=1$. Z AL (limita součinu je součin limit) proto $\Bigl(\dfrac{A_n}{n^{7/6}}\Bigr)^{2}\to1^2$, $\dfrac{A_n}{n^{7/6}}\cdot\dfrac{B_n}{n^{7/6}}\to1\cdot1$ a $\Bigl(\dfrac{B_n}{n^{7/6}}\Bigr)^{2}\to1^2$, takže všechny tři členy mají limitu 1.`,
    choice: T`Jak dál? {{cont}}, nebo {{alt}}.`,
    alt:  T`Jde to počítat i {{alt}}.`,
    note: T`Náhled: postup bez $A_n$, $B_n$, jen aby bylo vidět, co se děje uvnitř.`
  };

  var POPS = {
    same: {
      title: 'Chovají se stejně',
      html: T`<p>Posloupnosti $A_n$ a $B_n$ se chovají stejně, když</p>
              <p style="text-align:center">$\displaystyle\lim_{n\to\infty}\frac{A_n}{B_n}=c,$</p>
              <p>kde $c\neq0$ je konečná konstanta.</p>
              <p>To způsobuje právě ten problém: obě rostou stejně rychle, takže rozdíl $A_n-B_n$ je typu $\infty-\infty$ a aritmetikou limit (AL) ho nespočítáme, ani po vytknutí nejrychleji rostoucího členu.</p>`
    },
    subst: {
      title: 'Dosazení do vzorce',
      html: T`<p>Vzorec $a-b=\dfrac{a^3-b^3}{a^2+ab+b^2}$ s dosazením</p>
              <p style="text-align:center">$a=A_n=\sqrt[3]{n^{7/2}+n^{7/3}},\qquad b=B_n=\sqrt[3]{n^{7/2}-n^{7/3}}.$</p>
              <p>Třetí mocnina ruší třetí odmocninu:</p>
              <p style="text-align:center">$a^3=A_n^3=n^{7/2}+n^{7/3},\qquad b^3=B_n^3=n^{7/2}-n^{7/3}.$</p>
              <p>Proto</p>
              <p style="text-align:center">$A_n-B_n=\dfrac{\bigl(n^{7/2}+n^{7/3}\bigr)-\bigl(n^{7/2}-n^{7/3}\bigr)}{A_n^2+A_nB_n+B_n^2}.$</p>`
    },
    alt: {
      title: 'Počítat bez A<sub>n</sub> a B<sub>n</sub>',
      html: T`<p>Tento postup <b>nedoporučuji</b> používat u písemky. Zobrazí jen to, co se děje uvnitř, když se $A_n$ a $B_n$ rozepíšou na celé odmocniny.</p>
              <p>Se značením $A_n$ a $B_n$ je výpočet mnohem praktičtější a přehlednější.</p>`,
      action: ['inside', 'Zobrazit, co se děje uvnitř']
    }
  };

  /* ---------- helpers ---------- */
  function mathHTML(tex, display) { return katex.renderToString(tex, { throwOnError: false, displayMode: !!display }); }
  function rich(str) {
    var parts = str.split('$'), out = '';
    for (var i = 0; i < parts.length; i++) {
      if (i % 2) out += mathHTML(parts[i]);
      else out += parts[i]
        .replace('{{term}}', '<button class="term" data-pop="same" type="button">stejně</button>')
        .replace('{{cont}}', '<button class="term" data-act="cont" type="button">pokračovat s A<sub>n</sub>, B<sub>n</sub></button>')
        .replace('{{alt}}', '<button class="term" data-pop="alt" type="button">bez A<sub>n</sub>, B<sub>n</sub></button>');
    }
    return out;
  }

  var assign = document.getElementById('assign'), ex = document.getElementById('ex'), lines = document.getElementById('lines');
  var pop = document.getElementById('pop');
  var token = 0, popOpen = false, insideShown = false;
  var goal = 0, passed = 0, waiting = null, replaying = true, curTh = null;
  var TOTAL = 24;                                    // number of steps of the story
  var prevBtn = document.getElementById('prev'), nextBtn = document.getElementById('next'), stepno = document.getElementById('stepno');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function sync() {
    stepno.textContent = 'Krok ' + Math.min(passed + 1, TOTAL) + ' z ' + TOTAL;
    prevBtn.disabled = goal === 0;
    nextBtn.disabled = !waiting;
  }
  function frame() {
    if (replaying) return Promise.resolve();
    return new Promise(function (r) { requestAnimationFrame(function () { requestAnimationFrame(r); }); });
  }
  function wait(ms, my) { return new Promise(function (res) { setTimeout(function () { if (my === token) res(); }, replaying ? 0 : ms); }); }
  function follow(el) {
    if (replaying) return;
    var b = el.getBoundingClientRect();
    if (b.bottom > window.innerHeight - 90) window.scrollBy({ top: b.bottom - window.innerHeight + 140, behavior: reduce ? 'auto' : 'smooth' });
  }
  function fadeOut(d) {
    d.classList.remove('in');
    if (replaying) { if (d.parentNode) d.parentNode.removeChild(d); return; }
    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 1000);
  }
  function clearTh() { if (curTh) { fadeOut(curTh); curTh = null; } }

  // the story stops here until the reader presses "Dál" (when going back, the story is replayed quickly up to the requested step)
  function gate(my) {
    return new Promise(function (resolve) {
      if (my !== token) return;
      if (passed < goal) { passed++; resolve(); return; }
      replaying = false;
      waiting = function () { passed++; waiting = null; resolve(); };
      sync();
    });
  }

  async function addLine(tex, my, cls, secs, popBtn) {
    clearTh();
    var d = document.createElement('div'); d.className = 'line' + (cls ? ' ' + cls : '');
    d.innerHTML = '<span class="reveal">' + mathHTML('\\displaystyle ' + tex) + '</span>' +
      (popBtn ? '<button class="term lineterm" data-pop="' + popBtn[0] + '" type="button">' + popBtn[1] + '</button>' : '');
    d.firstChild.style.setProperty('--dur', (replaying ? 0 : secs) + 's');
    lines.appendChild(d); follow(d);
    await frame(); if (my !== token) return;
    d.classList.add('in');
    var rp = replaying;
    setTimeout(function () { d.classList.add('done'); }, rp ? 0 : secs * 1000 + 300);
  }

  async function think(key, my, dim, keep) {
    clearTh();
    var d = document.createElement('div'); d.className = 'th' + (dim ? ' dim' : '');
    d.innerHTML = '<div><p>' + rich(TH[key]) + '</p></div>';
    lines.appendChild(d);
    await frame(); if (my !== token) return;
    d.classList.add('in'); follow(d);
    if (!keep) curTh = d;
  }

  // comment on the left; then the same intermediate calculation for A_n and B_n is written on the right, line by line (A_n and B_n at the same time)
  async function midBlock(my) {
    clearTh();
    var d = document.createElement('div'); d.className = 'th mid';
    d.innerHTML = '<div><div class="midl"><p>' + rich(TH.midq) + '</p></div>' +
                  '<div class="midr"><div class="blk"></div><div class="blk"></div></div></div>';
    lines.appendChild(d);
    await frame(); if (my !== token) return;
    d.classList.add('in'); follow(d);
    curTh = d;
    await gate(my); if (my !== token) return;
    var blocks = d.querySelectorAll('.blk');
    for (var i = 0; i < MID.a.length; i++) {
      var pair = [MID.a[i], MID.b[i]].map(function (tex, k) {
        var e = document.createElement('div'); e.className = 'ml';
        e.innerHTML = '<span class="reveal">' + mathHTML('\\displaystyle ' + tex) + '</span>';
        e.firstChild.style.setProperty('--dur', (replaying ? 0 : 2.2) + 's');
        blocks[k].appendChild(e); return e;
      });
      follow(d);
      await frame(); if (my !== token) return;
      pair.forEach(function (e) { e.classList.add('in'); });
      await gate(my); if (my !== token) return;
    }
  }

  // "without A_n, B_n": appended below on request
  async function showInside() {
    if (insideShown) return; insideShown = true;
    var my = token;
    var n = document.createElement('div'); n.className = 'inside-note'; n.innerHTML = '<p>' + rich(TH.note) + '</p>';
    lines.appendChild(n); follow(n);
    for (var i = 0; i < INSIDE.length; i++) { await addLine(INSIDE[i], my, 'inside', 2.8); await wait(3100, my); if (my !== token) return; }
  }

  /* ---------- the story: every step waits for the reader ---------- */
  async function run(target) {
    var my = ++token;
    goal = target || 0; passed = 0; waiting = null; replaying = true; curTh = null; insideShown = false;
    lines.innerHTML = ''; closePop();
    ex.innerHTML = mathHTML(ASSIGN, false);
    assign.classList.add('in');
    window.scrollTo(0, 0);
    sync();

    await think('q', my);          await gate(my); if (my !== token) return;
    await think('mark', my);       await gate(my); if (my !== token) return;
    await think('dom', my);        await gate(my); if (my !== token) return;
    await think('asym', my);       await gate(my); if (my !== token) return;
    await midBlock(my);            if (my !== token) return;
    await think('chk', my);        await gate(my); if (my !== token) return;
    await think('yes', my);        await gate(my); if (my !== token) return;
    await think('no', my, true);   await gate(my); if (my !== token) return;
    await think('form', my);       await gate(my); if (my !== token) return;

    await addLine(L1, my, '', 3.2, ['subst', 'dosazení']);   await gate(my); if (my !== token) return;
    await think('sub', my);        await gate(my); if (my !== token) return;
    await addLine(L2, my, '', 3.6);                          await gate(my); if (my !== token) return;
    await think('num', my);        await gate(my); if (my !== token) return;
    await think('den', my);        await gate(my); if (my !== token) return;
    await think('choice', my, false, true);                  // "Dál" = pokračovat s A_n, B_n; "bez A_n, B_n" opens its popup
    await gate(my); if (my !== token) return;
    var ch = lines.querySelector('[data-act="cont"]'); if (ch) ch.classList.add('chosen');
    await addLine(L3, my, '', 3);  await gate(my); if (my !== token) return;
    await think('cut', my);        await gate(my); if (my !== token) return;
    await think('ref', my);        await gate(my); if (my !== token) return;
    await addLine(L4, my, '', 3);
    replaying = false; sync();
  }

  /* ---------- the clickable phrases ---------- */
  var ACTIONS = { inside: showInside };

  function openPop(btn) {
    var P = POPS[btn.getAttribute('data-pop')] || POPS.same;
    pop.innerHTML = '<div class="pt">' + P.title + '</div>' + rich(P.html) +
      '<div class="acts">' + (P.action ? '<button class="do" type="button">' + P.action[1] + '</button>' : '') +
      '<button class="x" type="button">Zavřít</button></div>';
    pop.hidden = false;
    var b = btn.getBoundingClientRect(), pw = pop.offsetWidth;
    var left = Math.max(16, Math.min(window.scrollX + b.left, window.scrollX + window.innerWidth - pw - 16));
    pop.style.left = left + 'px'; pop.style.top = (window.scrollY + b.bottom + 10) + 'px';
    popOpen = true;
    pop.querySelector('.x').addEventListener('click', function () { closePop(); });
    var go = pop.querySelector('.do');
    if (go) go.addEventListener('click', function () { closePop(); ACTIONS[P.action[0]](); });
  }
  function closePop() { pop.hidden = true; popOpen = false; }

  document.addEventListener('click', function (e) {
    var c = e.target.closest ? e.target.closest('[data-act="cont"]') : null;
    if (c) { e.preventDefault(); if (popOpen) closePop(); stepNext(); return; }
    var t = e.target.closest ? e.target.closest('.term') : null;
    if (t) { e.preventDefault(); if (popOpen) closePop(); else openPop(t); return; }
    if (popOpen && !pop.contains(e.target)) closePop();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && popOpen) closePop(); });

  /* ---------- controls ---------- */
  function stepNext() { if (waiting) { goal++; waiting(); sync(); } }
  function stepBack() { if (goal > 0) run(goal - 1); }
  nextBtn.addEventListener('click', stepNext);
  prevBtn.addEventListener('click', stepBack);
  document.getElementById('again').addEventListener('click', function () { run(0); });
  document.addEventListener('keydown', function (e) {
    if (popOpen) return;
    if (e.key === 'ArrowRight' || (e.key === ' ' && e.target === document.body)) { e.preventDefault(); stepNext(); }
    else if (e.key === 'ArrowLeft') stepBack();
  });

  run(0);
})();
</script>
</body>
